# mkdocs.yml —— 在线书站的总配置

site_name: 吴迪日记
site_description: 一本关于 AI Agent 在工作与生活中应用的开源书
site_url: https://colipsohp.github.io/ai-agent-in-work-and-life/   # 必须改成自己的
repo_url: https://github.com/colipsohp/ai-agent-in-work-and-life    # 必须改成自己的
repo_name: ai-agent-in-work-and-life
edit_uri: edit/main/book/     # 页脚"编辑此页"铅笔指向 GitHub main 分支（docs_dir 是 book/，需带上前缀）

docs_dir: book                # 书稿目录即站点根目录（书稿是唯一事实来源）

# 侧边栏目录：想出现在书站上的页面必须在这里列出（路径相对 docs_dir）
nav:
  - 首页: index.md
  - 引言: introduction.md
  - 8月22日 - 整理一堆麻烦的单据: chapter1.md
  - 8月23日 - 隔空取物: chapter2.md
  - 8月25日 - 安排旅游: chapter3.md
  - 9月2日 - C盘满了: chapter4.md
  - 后记: afterword.md

theme:
  name: material
  language: zh                # 界面文字用中文
  features:
    - navigation.instant      # 章节间无刷新跳转，像单页应用
    - navigation.top          # "回到顶部"按钮
    - navigation.footer       # 页面底部"上一章 / 下一章"翻页
    - toc.follow              # 右侧本页目录跟随滚动高亮
    - search.suggest          # 搜索自动补全
    - search.highlight        # 搜索结果关键词高亮
    - search.share            # 搜索结果链接可分享
    - content.code.copy       # 代码块一键复制
    - content.action.edit     # 页脚"编辑此页"
    - content.action.view     # 页脚"查看本页源码"

plugins:
  - search:
      lang: [ja, en]          # ja 分词器对中文分词效果好（ai-agent-book 同款配置）
  - git-revision-date-localized:      # 页脚显示"最后更新/创建于"（SEO 新鲜度信号）
      enable_creation_date: true
      type: date
      fallback_to_build_date: true    # 本地没提交历史时退化为构建日期
  - social:                           # 自动生成 OG/Twitter 分享卡片（链接分享到微信/推特带预览图）
      enabled: !ENV [CI, false]       # 只在 CI 构建时生成，本地 `mkdocs serve` 提速

markdown_extensions:
  - admonition                # !!! note / !!! tip 提示框
  - attr_list                 # {#锚点}、图片尺寸等属性
  - footnotes                 # 脚注 [^1]
  - md_in_html
  - toc:
      permalink: true         # 每个标题旁的 # 锚点链接
  - pymdownx.arithmatex       # LaTeX 公式渲染
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid       # ```mermaid 代码块直接渲染成图
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tabbed           # === 选项卡
  - pymdownx.details          # ??? 可折叠块
  - pymdownx.highlight        # 代码高亮

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js   # mermaid 图运行时
